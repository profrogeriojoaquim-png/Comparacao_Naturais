<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Saci Sabido - Comparação de Números</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 40px;
            padding: 24px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.2s ease;
        }

        button:hover:not(:disabled) {
            background: #4f46e5;
            transform: scale(1.02);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .hidden {
            display: none;
        }

        .feedback {
            margin: 15px auto;
            padding: 10px;
            border-radius: 40px;
            font-weight: bold;
            animation: fadeInOut 0.5s ease;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-10px); }
            20% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        .feedback-sucesso {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }

        .feedback-erro {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        .numero-card {
            background: #f1f5f9;
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            font-family: monospace;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-width: 120px;
            transition: transform 0.3s ease;
        }

        .numero-card.animar {
            transform: scale(1.05);
        }

        .operador-btn {
            font-size: 32px;
            font-weight: bold;
            background: #f8fafc;
            color: #1e293b;
            border: 2px solid #e2e8f0;
            padding: 20px 25px;
            border-radius: 60px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .operador-btn:hover:not(:disabled) {
            background: #e0e7ff;
            border-color: #6366f1;
            transform: scale(1.05);
        }

        .operador-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .numeros-container {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .text-center {
            text-align: center;
        }

        .mt-2 {
            margin-top: 8px;
        }

        .info-sesi {
            background: #fef9c3;
            border-radius: 20px;
            padding: 10px;
            margin-top: 10px;
            font-size: 12px;
            color: #854d0e;
        }

        .erro-acesso {
            text-align: center;
            padding: 50px;
            font-family: Arial, sans-serif;
        }
        .erro-acesso h2 {
            color: #e53e3e;
            margin-bottom: 20px;
        }
        .erro-acesso button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        .estrelas {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 10px 0;
        }
        .estrela {
            font-size: 28px;
            color: #cbd5e1;
            transition: color 0.3s ease;
        }
        .estrela.ativa {
            color: #fbbf24;
            text-shadow: 0 0 2px goldenrod;
        }

        .personagem-convite {
            display: flex;
            align-items: center;
            gap: 20px;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }
        .personagem-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #d97706;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .personagem-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .personagem-fala {
            flex: 1;
        }
        .personagem-fala p {
            font-size: 16px;
            font-weight: bold;
            color: #92400e;
            margin-bottom: 8px;
        }
        .personagem-fala small {
            color: #b45309;
        }
        .niveis-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }
        .btn-nivel {
            background: #e2e8f0;
            color: #1e293b;
            padding: 12px 24px;
            font-size: 14px;
        }
        .btn-nivel.ativo {
            background: #6366f1;
            color: white;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            transition: width 0.3s ease;
            width: 0%;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .revisao-erros {
            background: white;
            border-radius: 20px;
            padding: 15px;
            margin-top: 15px;
            text-align: left;
            max-height: 300px;
            overflow-y: auto;
        }

        .erro-item {
            padding: 10px;
            margin: 5px 0;
            background: #fef2f2;
            border-left: 3px solid #ef4444;
            border-radius: 8px;
            font-size: 14px;
        }

        @media (max-width: 640px) {
            .container {
                padding: 16px;
            }
            .numero-card {
                padding: 20px;
                font-size: 36px;
                min-width: 100px;
            }
            .operador-btn {
                padding: 15px 20px;
                font-size: 28px;
            }
            .personagem-convite {
                flex-direction: column;
                text-align: center;
            }
        }

        [aria-label] {
            position: relative;
        }
    </style>
</head>
<body>

<div id="app"></div>

<template id="telaInicialTemplate">
    <div class="personagem-convite">
        <div class="personagem-img">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23d97706'/%3E%3Ccircle cx='35' cy='40' r='5' fill='white'/%3E%3Ccircle cx='65' cy='40' r='5' fill='white'/%3E%3Cpath d='M40 60 Q50 70 60 60' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E" alt="Saci Pererê">
        </div>
        <div class="personagem-fala">
            <p>"E aí, corajoso! Vamos testar seus conhecimentos?"</p>
            <small>⚡ Escolha um nível e comece o desafio!</small>
        </div>
    </div>
    
    <h1>🧮 Comparação de Números Naturais</h1>
    
    <div class="niveis-container">
        <button class="btn-nivel" data-nivel="facil" aria-label="Nível Fácil - Números até 20">🍃 Fácil</button>
        <button class="btn-nivel" data-nivel="medio" aria-label="Nível Médio - Números até 50">⚡ Médio</button>
        <button class="btn-nivel" data-nivel="dificil" aria-label="Nível Difícil - Números até 100">🔥 Difícil</button>
    </div>
    
    <div class="info-sesi" role="note" aria-label="Informações da habilidade">
        📚 Habilidade: <strong>EF1a5.MAT.1.03</strong><br>
        🎯 Comparar e ordenar números naturais em diferentes contextos
    </div>

    <div style="background:#f1f5f9; border-radius:20px; padding:12px; margin:20px 0; font-size:14px; text-align:left;">
        <strong>📋 Como jogar:</strong><br>
        • Você verá dois números.<br>
        • Escolha o operador correto: <strong>></strong> (maior), <strong>&lt;</strong> (menor) ou <strong>=</strong> (igual).<br>
        • A cada acerto, você avança de nível!<br>
        • Complete 10 perguntas para finalizar.
    </div>
    
    <button id="btnIniciar" aria-label="Iniciar desafio">🚀 INICIAR DESAFIO</button>
    <div id="statusConexao" class="text-center mt-2" style="font-size:12px;" role="status"></div>
</template>

<template id="telaJogoTemplate">
    <div style="display:flex; justify-content:space-between; background:#f8fafc; border-radius:30px; padding:12px 20px; margin-bottom:25px; gap:15px; flex-wrap:wrap;">
        <div style="background:white; border-radius:20px; padding:8px 16px; flex:1; text-align:center;">
            <span style="font-size:12px;">⭐ PONTOS</span>
            <div style="font-size:28px; font-weight:800;" id="pontos" aria-live="polite">0</div>
        </div>
        <div style="background:white; border-radius:20px; padding:8px 16px; flex:1; text-align:center;">
            <span style="font-size:12px;">✅ ACERTOS</span>
            <div style="font-size:28px; font-weight:800;" id="acertos" aria-live="polite">0</div>
        </div>
        <div style="background:white; border-radius:20px; padding:8px 16px; flex:1; text-align:center;">
            <span style="font-size:12px;">❌ ERROS</span>
            <div style="font-size:28px; font-weight:800;" id="erros" aria-live="polite">0</div>
        </div>
        <div style="background:white; border-radius:20px; padding:8px 16px; flex:1; text-align:center;">
            <span style="font-size:12px;">⏱️ TEMPO</span>
            <div style="font-size:28px; font-weight:800;" id="tempo" aria-live="polite">00:00</div>
        </div>
    </div>

    <div style="display:flex; justify-content:space-between; background:#f8fafc; border-radius:30px; padding:8px 16px; margin-bottom:20px;">
        <div><strong>Nível:</strong> <span id="nivelAtual">1</span></div>
        <div><strong>Pergunta:</strong> <span id="perguntaAtual">1</span> / <span id="totalPerguntas">10</span></div>
    </div>

    <div class="progress-bar" role="progressbar" aria-label="Progresso do jogo">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="numeros-container">
        <div class="numero-card" id="numeroEsquerda" aria-label="Número da esquerda">0</div>
        <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
            <button class="operador-btn" id="opMaior" aria-label="Maior que">&gt;</button>
            <button class="operador-btn" id="opMenor" aria-label="Menor que">&lt;</button>
            <button class="operador-btn" id="opIgual" aria-label="Igual a">=</button>
        </div>
        <div class="numero-card" id="numeroDireita" aria-label="Número da direita">0</div>
    </div>
    
    <div id="feedbackJogo" class="feedback" role="alert" aria-live="assertive"></div>
    <button id="btnSair" aria-label="Sair do jogo" style="background:#10b981;">🔒 SAIR</button>
    <button id="btnPular" aria-label="Pular pergunta" style="background:#f59e0b;">⏭️ PULAR PERGUNTA</button>
</template>

<template id="telaFinalTemplate">
    <h1>🏆 Parabéns!</h1>
    <div style="background:#eef2ff; padding:20px; border-radius:30px; margin:20px 0;">
        <p><strong>Pontuação final:</strong> <span id="finalPontos">0</span></p>
        <p><strong>Acertos:</strong> <span id="finalAcertos">0</span> / <span id="totalPerguntasFinal">10</span></p>
        <p><strong>Erros:</strong> <span id="finalErros">0</span></p>
        <p><strong>Nível máximo:</strong> <span id="finalNivel">1</span></p>
        <p><strong>Tempo:</strong> <span id="finalTempo">00:00</span></p>
        <div class="estrelas" id="estrelasContainer" aria-label="Classificação por estrelas">
            <span class="estrela" id="estrela1" aria-hidden="true">★</span>
            <span class="estrela" id="estrela2" aria-hidden="true">★</span>
            <span class="estrela" id="estrela3" aria-hidden="true">★</span>
        </div>
        <div id="msgSalvo" class="text-sm mt-2" role="status"></div>
    </div>
    
    <div id="revisaoErrosContainer" class="hidden">
        <h3>📝 Revisão dos erros:</h3>
        <div id="listaErros" class="revisao-erros"></div>
    </div>
    
    <button id="btnNovamente" aria-label="Jogar novamente">🔄 JOGAR NOVAMENTE</button>
    <button id="btnFecharAba" aria-label="Fechar esta aba" style="background:#10b981;">🚪 FECHAR ESTA ABA</button>
    <div id="mensagemAba" class="text-sm mt-2" role="status"></div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ==================== CLASSE PRINCIPAL DO JOGO ====================
    class JogoComparacaoNumeros {
        constructor() {
            // Configurações Supabase
            this.SUPABASE_URL = 'https://qmcqffnawtfaenyziwsn.supabase.co';
            this.SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtY3FmZm5hd3RmYWVueXppd3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNTM5NTMsImV4cCI6MjA4OTcyOTk1M30._CjaNoeJeQp-8s8Jt-dk3bJfktdEV97R5LhLnWgYrNc';
            
            // Parâmetros da URL
            this.urlParams = new URLSearchParams(window.location.search);
            this.alunoId = this.urlParams.get('aluno_id');
            this.jogoId = this.urlParams.get('jogo_id');
            this.turmaId = this.urlParams.get('turma_id');
            this.accessToken = this.urlParams.get('token');
            this.modoTeste = this.urlParams.get('modo_teste') === 'true';
            
            // Estado do jogo
            this.pontuacao = 0;
            this.acertos = 0;
            this.erros = 0;
            this.jogoAtivo = false;
            this.tempoInicio = null;
            this.tempoDecorrido = 0;
            this.intervalo = null;
            this.detalhesErros = [];
            this.numeroEsquerda = 0;
            this.numeroDireita = 0;
            this.operadorCorreto = '';
            this.nivel = 1;
            this.perguntasRespondidas = 0;
            this.jogoIdAtual = this.jogoId;
            this.jogoNome = '';
            this.nivelSelecionado = 'medio';
            this.TOTAL_PERGUNTAS = 10;
            this.botoesBloqueados = false;
            
            // Inicializa Supabase
            this.supabase = window.supabase.createClient(this.SUPABASE_URL, this.SUPABASE_KEY);
            
            // Configurações dos níveis
            this.niveisConfig = {
                facil: { nome: 'Fácil', maxInicial: 20, incremento: 10, maxAbsoluto: 100 },
                medio: { nome: 'Médio', maxInicial: 50, incremento: 25, maxAbsoluto: 200 },
                dificil: { nome: 'Difícil', maxInicial: 100, incremento: 50, maxAbsoluto: 500 }
            };
        }
        
        // ==================== MÉTODOS AUXILIARES ====================
        getMaxNumero() {
            const config = this.niveisConfig[this.nivelSelecionado];
            const maxInicial = config.maxInicial;
            const incremento = config.incremento;
            const incrementos = Math.floor((this.nivel - 1) / 2);
            let maxNumero = maxInicial + (incrementos * incremento);
            return Math.min(maxNumero, config.maxAbsoluto);
        }
        
        // ==================== VERIFICAÇÃO DE ACESSO ====================
        async verificarAcessoJogo() {
            if (this.modoTeste) {
                console.log('🔧 Modo teste - acesso liberado sem verificação');
                return true;
            }
            
            if (!this.alunoId || !this.jogoId || !this.turmaId) {
                this.mostrarErroAcesso('❌ Link inválido. Faltam parâmetros necessários. Contate seu professor.');
                return false;
            }
            
            try {
                // Mostrar loading
                this.mostrarLoading(true);
                
                const { data: jogo, error: jogoError } = await this.supabase
                    .from('jogos')
                    .select('id, nome')
                    .eq('id', this.jogoId)
                    .single();
                
                if (jogoError || !jogo) {
                    this.mostrarErroAcesso('❌ Atividade não encontrada.');
                    return false;
                }
                
                this.jogoNome = jogo.nome;
                this.jogoIdAtual = jogo.id;
                
                const { data: aluno, error: alunoError } = await this.supabase
                    .from('alunos')
                    .select('id, nome_aluno, ativo, turma_id')
                    .eq('id', this.alunoId)
                    .eq('ativo', true)
                    .single();
                
                if (alunoError || !aluno) {
                    this.mostrarErroAcesso('❌ Aluno não encontrado ou inativo. Contate seu professor.');
                    return false;
                }
                
                if (aluno.turma_id !== this.turmaId) {
                    this.mostrarErroAcesso('❌ Turma não corresponde ao aluno. Contate seu professor.');
                    return false;
                }
                
                this.mostrarLoading(false);
                return true;
                
            } catch (error) {
                console.error('Erro na verificação:', error);
                this.mostrarErroAcesso('Erro ao verificar acesso. Tente novamente mais tarde.');
                return false;
            }
        }
        
        mostrarLoading(mostrar) {
            const statusDiv = document.getElementById('statusConexao');
            if (statusDiv) {
                if (mostrar) {
                    statusDiv.innerHTML = '<div class="loading"></div> Verificando acesso...';
                } else {
                    statusDiv.innerHTML = this.modoTeste ? '🔧 Modo teste' : '✅ Conectado';
                }
            }
        }
        
        mostrarErroAcesso(mensagem) {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="erro-acesso" style="background: white; border-radius: 40px; padding: 40px; max-width: 500px; margin: 20px auto;">
                    <h2>⛔ Acesso Negado</h2>
                    <p style="color: #e53e3e; margin: 20px 0;">${mensagem}</p>
                    <button onclick="window.history.back()" aria-label="Voltar">Voltar</button>
                </div>
            `;
        }
        
        // ==================== FUNÇÕES DO JOGO ====================
        calcularEstrelas() {
            if (this.erros === 0 && this.tempoDecorrido <= 30) return 3;
            if (this.erros <= 2 && this.tempoDecorrido <= 60) return 2;
            return 1;
        }
        
        exibirEstrelas(qtd) {
            for (let i = 1; i <= 3; i++) {
                const estrela = document.getElementById(`estrela${i}`);
                if (estrela) {
                    if (i <= qtd) estrela.classList.add('ativa');
                    else estrela.classList.remove('ativa');
                }
            }
        }
        
        animarNumero() {
            const esquerda = document.getElementById('numeroEsquerda');
            const direita = document.getElementById('numeroDireita');
            if (esquerda) esquerda.classList.add('animar');
            if (direita) direita.classList.add('animar');
            setTimeout(() => {
                if (esquerda) esquerda.classList.remove('animar');
                if (direita) direita.classList.remove('animar');
            }, 300);
        }
        
        gerarPergunta() {
            const maxNum = this.getMaxNumero();
            this.numeroEsquerda = Math.floor(Math.random() * (maxNum + 1));
            this.numeroDireita = Math.floor(Math.random() * (maxNum + 1));
            
            if (this.numeroEsquerda > this.numeroDireita) this.operadorCorreto = '>';
            else if (this.numeroEsquerda < this.numeroDireita) this.operadorCorreto = '<';
            else this.operadorCorreto = '=';
            
            const numEsqElement = document.getElementById('numeroEsquerda');
            const numDirElement = document.getElementById('numeroDireita');
            if (numEsqElement) numEsqElement.textContent = this.numeroEsquerda;
            if (numDirElement) numDirElement.textContent = this.numeroDireita;
            
            const nivelEl = document.getElementById('nivelAtual');
            const perguntaEl = document.getElementById('perguntaAtual');
            if (nivelEl) nivelEl.textContent = this.nivel;
            if (perguntaEl) perguntaEl.textContent = this.perguntasRespondidas + 1;
            
            this.animarNumero();
            this.atualizarProgresso();
        }
        
        atualizarUI() {
            const pontosEl = document.getElementById('pontos');
            const acertosEl = document.getElementById('acertos');
            const errosEl = document.getElementById('erros');
            if (pontosEl) pontosEl.textContent = Math.floor(this.pontuacao);
            if (acertosEl) acertosEl.textContent = this.acertos;
            if (errosEl) errosEl.textContent = this.erros;
        }
        
        atualizarProgresso() {
            const progressFill = document.getElementById('progressFill');
            if (progressFill) {
                const percent = (this.perguntasRespondidas / this.TOTAL_PERGUNTAS) * 100;
                progressFill.style.width = `${percent}%`;
            }
        }
        
        mostrarFeedback(mensagem, tipo) {
            const feedbackDiv = document.getElementById('feedbackJogo');
            if (!feedbackDiv) return;
            
            feedbackDiv.textContent = mensagem;
            feedbackDiv.className = 'feedback';
            if (tipo === 'sucesso') feedbackDiv.classList.add('feedback-sucesso');
            if (tipo === 'erro') feedbackDiv.classList.add('feedback-erro');
            
            setTimeout(() => {
                if (feedbackDiv.textContent === mensagem) {
                    feedbackDiv.textContent = '';
                    feedbackDiv.className = 'feedback';
                }
            }, 1500);
        }
        
        iniciarCronometro() {
            if (this.intervalo) clearInterval(this.intervalo);
            this.intervalo = setInterval(() => {
                if (!this.jogoAtivo) return;
                this.tempoDecorrido = Math.floor((Date.now() - this.tempoInicio) / 1000);
                const minutos = Math.floor(this.tempoDecorrido / 60);
                const segundos = this.tempoDecorrido % 60;
                const tempoFormatado = `${minutos.toString().padStart(2, '0')}:${segundos.toString().padStart(2, '0')}`;
                const tempoEl = document.getElementById('tempo');
                if (tempoEl) tempoEl.textContent = tempoFormatado;
            }, 1000);
        }
        
        pararCronometro() {
            if (this.intervalo) clearInterval(this.intervalo);
            this.intervalo = null;
            if (this.tempoInicio) {
                this.tempoDecorrido = Math.floor((Date.now() - this.tempoInicio) / 1000);
            }
        }
        
        async salvarResultado() {
            if (this.modoTeste || !this.alunoId || !this.jogoIdAtual || !this.turmaId) {
                const msgDiv = document.getElementById('msgSalvo');
                if (msgDiv) msgDiv.innerHTML = this.modoTeste ? '🔧 Modo teste - dados não salvos' : '⚠️ Parâmetros ausentes - não salvo';
                return;
            }
            
            // Ajustando os dados para corresponder exatamente à tabela 'resultados'
            const dados = {
                aluno_id: this.alunoId,
                jogo_id: this.jogoIdAtual,
                turma_id: this.turmaId,
                acertos: this.acertos,
                erros: this.erros,
                tempo_segundos: this.tempoDecorrido,
                total_questoes: this.TOTAL_PERGUNTAS,
                habilidade_bncc: 'EF1a5.MAT.1.03',
                detalhes_erros: this.detalhesErros.slice(0, 20),
                pontuacao_final: Math.floor(this.pontuacao)
                // NOTA: Removido 'nivel_maximo' pois esta coluna não existe na tabela
                // Se precisar salvar o nível, será necessário adicionar a coluna no Supabase
            };
            
            console.log('Salvando resultado:', dados);
            
            try {
                const { data, error } = await this.supabase.from('resultados').insert([dados]).select();
                const msgDiv = document.getElementById('msgSalvo');
                if (error) {
                    console.error('Erro ao salvar:', error);
                    msgDiv.innerHTML = `❌ Erro ao salvar: ${error.message}`;
                    
                    // Mostrar detalhes do erro no console para debug
                    console.error('Detalhes do erro:', {
                        message: error.message,
                        details: error.details,
                        hint: error.hint,
                        code: error.code
                    });
                } else {
                    console.log('Salvo com sucesso:', data);
                    msgDiv.innerHTML = '✅ Pontuação registrada!';
                    
                    // Limpar mensagem após 3 segundos
                    setTimeout(() => {
                        if (msgDiv.innerHTML === '✅ Pontuação registrada!') {
                            msgDiv.innerHTML = '';
                        }
                    }, 3000);
                }
            } catch (error) {
                console.error('Erro na requisição:', error);
                const msgDiv = document.getElementById('msgSalvo');
                if (msgDiv) msgDiv.innerHTML = '❌ Erro de conexão ao salvar';
            }
        }
        
        async finalizarJogo() {
            if (!this.jogoAtivo) return;
            this.jogoAtivo = false;
            this.pararCronometro();
            
            const estrelas = this.calcularEstrelas();
            this.exibirEstrelas(estrelas);
            
            const finalPontos = document.getElementById('finalPontos');
            const finalAcertos = document.getElementById('finalAcertos');
            const finalErros = document.getElementById('finalErros');
            const finalNivel = document.getElementById('finalNivel');
            const finalTempo = document.getElementById('finalTempo');
            const totalPerguntasFinal = document.getElementById('totalPerguntasFinal');
            
            if (finalPontos) finalPontos.textContent = Math.floor(this.pontuacao);
            if (finalAcertos) finalAcertos.textContent = this.acertos;
            if (finalErros) finalErros.textContent = this.erros;
            if (finalNivel) finalNivel.textContent = this.nivel;
            if (finalTempo) finalTempo.textContent = `${Math.floor(this.tempoDecorrido / 60)}:${(this.tempoDecorrido % 60).toString().padStart(2, '0')}`;
            if (totalPerguntasFinal) totalPerguntasFinal.textContent = this.TOTAL_PERGUNTAS;
            
            // Mostrar revisão de erros
            this.mostrarRevisaoErros();
            
            await this.salvarResultado();
            
            const telaJogo = document.getElementById('telaJogo');
            const telaFinal = document.getElementById('telaFinal');
            if (telaJogo) telaJogo.classList.add('hidden');
            if (telaFinal) telaFinal.classList.remove('hidden');
        }
        
        mostrarRevisaoErros() {
            const container = document.getElementById('revisaoErrosContainer');
            const listaErros = document.getElementById('listaErros');
            
            if (!container || !listaErros) return;
            
            if (this.detalhesErros.length > 0) {
                container.classList.remove('hidden');
                listaErros.innerHTML = this.detalhesErros.map((erro, index) => `
                    <div class="erro-item">
                        <strong>❌ Erro ${index + 1}:</strong> ${erro.pergunta}<br>
                        <span style="color: #dc2626;">Sua resposta: ${erro.resposta_aluno}</span><br>
                        <span style="color: #059669;">Resposta correta: ${erro.resposta_correta}</span>
                    </div>
                `).join('');
            } else {
                container.classList.add('hidden');
            }
        }
        
        registrarAcerto(pontosGanhos = 10) {
            if (!this.jogoAtivo) return;
            this.pontuacao += pontosGanhos;
            this.acertos++;
            this.atualizarUI();
            this.mostrarFeedback(`✅ Correto! +${pontosGanhos} pontos`, 'sucesso');
            
            // Aumenta o nível a cada 3 acertos
            if (this.acertos % 3 === 0 && this.nivel < 20) {
                this.nivel++;
                const nivelEl = document.getElementById('nivelAtual');
                if (nivelEl) nivelEl.textContent = this.nivel;
                this.mostrarFeedback(`🎉 Parabéns! Você subiu para o nível ${this.nivel}!`, 'sucesso');
            }
        }
        
        registrarErro(erroDetalhe = null) {
            if (!this.jogoAtivo) return;
            this.erros++;
            this.pontuacao = Math.max(0, this.pontuacao - 5);
            this.atualizarUI();
            if (erroDetalhe) this.detalhesErros.push(erroDetalhe);
            this.mostrarFeedback(`❌ Ops! O correto era ${this.operadorCorreto}. -5 pontos`, 'erro');
        }
        
        async responderOperador(operadorEscolhido) {
            if (!this.jogoAtivo || this.botoesBloqueados) return;
            
            // Bloqueia botões temporariamente
            this.bloquearBotoes(true);
            
            const acertou = (operadorEscolhido === this.operadorCorreto);
            
            if (acertou) {
                this.registrarAcerto(10);
            } else {
                const detalhe = {
                    pergunta: `${this.numeroEsquerda} ? ${this.numeroDireita}`,
                    resposta_aluno: operadorEscolhido,
                    resposta_correta: this.operadorCorreto,
                    detrator: `Aluno escolheu ${operadorEscolhido} quando o correto era ${this.operadorCorreto}`
                };
                this.registrarErro(detalhe);
            }
            
            this.perguntasRespondidas++;
            this.atualizarProgresso();
            
            if (this.perguntasRespondidas >= this.TOTAL_PERGUNTAS) {
                await this.finalizarJogo();
            } else {
                this.gerarPergunta();
            }
            
            // Desbloqueia botões após delay
            setTimeout(() => {
                this.bloquearBotoes(false);
            }, 500);
        }
        
        bloquearBotoes(bloquear) {
            this.botoesBloqueados = bloquear;
            const botoes = ['opMaior', 'opMenor', 'opIgual'];
            botoes.forEach(id => {
                const btn = document.getElementById(id);
                if (btn) btn.disabled = bloquear;
            });
        }
        
        pularPergunta() {
            if (!this.jogoAtivo || this.botoesBloqueados) return;
            
            this.bloquearBotoes(true);
            
            const detalhe = {
                pergunta: `${this.numeroEsquerda} ? ${this.numeroDireita}`,
                resposta_aluno: 'Pulou',
                resposta_correta: this.operadorCorreto,
                detrator: 'Aluno pulou a pergunta'
            };
            this.registrarErro(detalhe);
            
            this.perguntasRespondidas++;
            this.atualizarProgresso();
            
            if (this.perguntasRespondidas >= this.TOTAL_PERGUNTAS) {
                this.finalizarJogo();
            } else {
                this.gerarPergunta();
            }
            
            setTimeout(() => {
                this.bloquearBotoes(false);
            }, 500);
        }
        
        iniciarJogo() {
            this.pontuacao = 0;
            this.acertos = 0;
            this.erros = 0;
            this.nivel = 1;
            this.perguntasRespondidas = 0;
            this.detalhesErros = [];
            this.jogoAtivo = true;
            this.tempoInicio = Date.now();
            this.tempoDecorrido = 0;
            this.botoesBloqueados = false;
            
            this.atualizarUI();
            this.gerarPergunta();
            this.iniciarCronometro();
            
            const telaInicial = document.getElementById('telaInicial');
            const telaJogo = document.getElementById('telaJogo');
            const telaFinal = document.getElementById('telaFinal');
            const feedbackJogo = document.getElementById('feedbackJogo');
            
            if (telaInicial) telaInicial.classList.add('hidden');
            if (telaJogo) telaJogo.classList.remove('hidden');
            if (telaFinal) telaFinal.classList.add('hidden');
            if (feedbackJogo) feedbackJogo.textContent = '';
            
            // Habilita botões
            this.bloquearBotoes(false);
        }
        
        fecharAba() {
            window.close();
            setTimeout(() => {
                const msgDiv = document.getElementById('mensagemAba');
                if (msgDiv) {
                    msgDiv.innerHTML = "⚠️ Seu navegador não permitiu fechar esta aba. Feche manualmente.";
                }
            }, 200);
        }
        
        selecionarNivel(nivel) {
            this.nivelSelecionado = nivel;
            document.querySelectorAll('.btn-nivel').forEach(btn => {
                btn.classList.remove('ativo');
            });
            const btnSelecionado = document.querySelector(`.btn-nivel[data-nivel="${nivel}"]`);
            if (btnSelecionado) btnSelecionado.classList.add('ativo');
        }
        
        // ==================== RENDERIZAÇÃO DAS TELAS ====================
        carregarTemplates() {
            const telaInicialTemplate = document.getElementById('telaInicialTemplate');
            const telaJogoTemplate = document.getElementById('telaJogoTemplate');
            const telaFinalTemplate = document.getElementById('telaFinalTemplate');
            
            if (!telaInicialTemplate || !telaJogoTemplate || !telaFinalTemplate) {
                console.error('Templates não encontrados');
                return;
            }
            
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="container">
                    <div id="telaInicial"></div>
                    <div id="telaJogo" class="hidden"></div>
                    <div id="telaFinal" class="hidden"></div>
                </div>
            `;
            
            const telaInicialDiv = document.getElementById('telaInicial');
            const telaJogoDiv = document.getElementById('telaJogo');
            const telaFinalDiv = document.getElementById('telaFinal');
            
            if (telaInicialDiv) telaInicialDiv.appendChild(telaInicialTemplate.content.cloneNode(true));
            if (telaJogoDiv) telaJogoDiv.appendChild(telaJogoTemplate.content.cloneNode(true));
            if (telaFinalDiv) telaFinalDiv.appendChild(telaFinalTemplate.content.cloneNode(true));
            
            // Configura total de perguntas nos templates
            const totalPerguntasSpan = document.getElementById('totalPerguntas');
            if (totalPerguntasSpan) totalPerguntasSpan.textContent = this.TOTAL_PERGUNTAS;
            
            // Atualiza status da conexão
            const statusDiv = document.getElementById('statusConexao');
            if (statusDiv) {
                statusDiv.textContent = this.modoTeste ? '🔧 Modo teste' : (this.alunoId && this.jogoId ? '✅ Conectado' : '⚠️ Sem parâmetros');
            }
        }
        
        configurarEventos() {
            // Botões da tela inicial
            const btnIniciar = document.getElementById('btnIniciar');
            if (btnIniciar) btnIniciar.onclick = () => this.iniciarJogo();
            
            // Botões de nível
            document.querySelectorAll('.btn-nivel').forEach(btn => {
                const nivel = btn.getAttribute('data-nivel');
                if (nivel) {
                    btn.onclick = () => this.selecionarNivel(nivel);
                    if (nivel === this.nivelSelecionado) btn.classList.add('ativo');
                }
            });
            
            // Botões da tela de jogo
            const opMaior = document.getElementById('opMaior');
            const opMenor = document.getElementById('opMenor');
            const opIgual = document.getElementById('opIgual');
            const btnSair = document.getElementById('btnSair');
            const btnPular = document.getElementById('btnPular');
            
            if (opMaior) opMaior.onclick = () => this.responderOperador('>');
            if (opMenor) opMenor.onclick = () => this.responderOperador('<');
            if (opIgual) opIgual.onclick = () => this.responderOperador('=');
            if (btnSair) btnSair.onclick = () => {
                if (this.jogoAtivo && confirm("Deseja sair? O progresso será perdido.")) {
                    this.finalizarJogo();
                } else if (!this.jogoAtivo) {
                    const telaJogo = document.getElementById('telaJogo');
                    const telaInicial = document.getElementById('telaInicial');
                    if (telaJogo) telaJogo.classList.add('hidden');
                    if (telaInicial) telaInicial.classList.remove('hidden');
                }
            };
            if (btnPular) btnPular.onclick = () => this.pularPergunta();
            
            // Botões da tela final
            const btnNovamente = document.getElementById('btnNovamente');
            const btnFecharAba = document.getElementById('btnFecharAba');
            
            if (btnNovamente) btnNovamente.onclick = () => {
                const telaFinal = document.getElementById('telaFinal');
                const telaInicial = document.getElementById('telaInicial');
                if (telaFinal) telaFinal.classList.add('hidden');
                if (telaInicial) telaInicial.classList.remove('hidden');
            };
            if (btnFecharAba) btnFecharAba.onclick = () => this.fecharAba();
        }
        
        async init() {
            this.carregarTemplates();
            
            const acessoLiberado = await this.verificarAcessoJogo();
            
            if (!acessoLiberado && !this.modoTeste) {
                return;
            }
            
            this.configurarEventos();
        }
    }
    
    // ==================== INICIALIZAÇÃO ====================
    const jogo = new JogoComparacaoNumeros();
    jogo.init();
</script>
