<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Saci Sabido - Comparação de Números</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 40px;
            padding: 24px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.2s ease;
        }

        button:hover:not(:disabled) {
            background: #4f46e5;
            transform: scale(1.02);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .hidden {
            display: none;
        }

        .numero-card {
            background: #f1f5f9;
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            font-family: monospace;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-width: 120px;
            transition: transform 0.3s ease;
        }

        .numero-card.animar {
            transform: scale(1.05);
        }

        .operador-btn {
            font-size: 32px;
            font-weight: bold;
            background: #f8fafc;
            color: #1e293b;
            border: 2px solid #e2e8f0;
            padding: 20px 25px;
            border-radius: 60px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .operador-btn:hover:not(:disabled) {
            background: #e0e7ff;
            border-color: #6366f1;
            transform: scale(1.05);
        }

        .operador-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .numeros-container {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .text-center {
            text-align: center;
        }

        .mt-2 {
            margin-top: 8px;
        }

        .info-sesi {
            background: #fef9c3;
            border-radius: 20px;
            padding: 10px;
            margin-top: 10px;
            font-size: 12px;
            color: #854d0e;
        }

        .erro-acesso {
            text-align: center;
            padding: 50px;
        }
        .erro-acesso h2 {
            color: #e53e3e;
            margin-bottom: 20px;
        }
        .erro-acesso button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        .estrelas {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 10px 0;
        }
        .estrela {
            font-size: 28px;
            color: #cbd5e1;
            transition: color 0.3s ease;
        }
        .estrela.ativa {
            color: #fbbf24;
            text-shadow: 0 0 2px goldenrod;
        }

        .personagem-convite {
            display: flex;
            align-items: center;
            gap: 20px;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }
        .personagem-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #d97706;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .personagem-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .personagem-fala {
            flex: 1;
        }
        .personagem-fala p {
            font-size: 16px;
            font-weight: bold;
            color: #92400e;
            margin-bottom: 8px;
        }
        .personagem-fala small {
            color: #b45309;
        }
        .niveis-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }
        .btn-nivel {
            background: #e2e8f0;
            color: #1e293b;
            padding: 12px 24px;
            font-size: 14px;
        }
        .btn-nivel.ativo {
            background: #6366f1;
            color: white;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            transition: width 0.3s ease;
            width: 0%;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .revisao-erros {
            background: white;
            border-radius: 20px;
            padding: 15px;
            margin-top: 15px;
            text-align: left;
            max-height: 300px;
            overflow-y: auto;
        }

        .erro-item {
            padding: 10px;
            margin: 5px 0;
            background: #fef2f2;
            border-left: 3px solid #ef4444;
            border-radius: 8px;
            font-size: 14px;
        }

        @media (max-width: 640px) {
            .container {
                padding: 16px;
            }
            .numero-card {
                padding: 20px;
                font-size: 36px;
                min-width: 100px;
            }
            .operador-btn {
                padding: 15px 20px;
                font-size: 28px;
            }
            .personagem-convite {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<div id="app"></div>

<template id="telaInicialTemplate">
    <div class="personagem-convite">
        <div class="personagem-img">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23d97706'/%3E%3Ccircle cx='35' cy='40' r='5' fill='white'/%3E%3Ccircle cx='65' cy='40' r='5' fill='white'/%3E%3Cpath d='M40 60 Q50 70 60 60' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E" alt="Saci Pererê">
        </div>
        <div class="personagem-fala">
            <p>"E aí, corajoso! Vamos testar seus conhecimentos?"</p>
            <small>⚡ Escolha um nível e comece o desafio!</small>
        </div>
    </div>
    
    <h1>🧮 Comparação de Números Naturais</h1>
    
    <div class="niveis-container">
        <button class="btn-nivel" data-nivel="facil">🍃 Fácil</button>
        <button class="btn-nivel" data-nivel="medio">⚡ Médio</button>
        <button class="btn-nivel" data-nivel="dificil">🔥 Difícil</button>
    </div>
    
    <div class="info-sesi">
        📚 Habilidade: <strong>EF1a5.MAT.1.03</strong><br>
        🎯 Comparar e ordenar números naturais em diferentes contextos
    </div>

    <div style="background:#f1f5f9; border-radius:20px; padding:12px; margin:20px 0; font-size:14px; text-align:left;">
        <strong>📋 Como jogar:</strong><br>
        • Você verá dois números.<br>
        • Escolha o operador correto: <strong>></strong> (maior), <strong>&lt;</strong> (menor) ou <strong>=</strong> (igual).<br>
        • Complete 10 perguntas para finalizar.
    </div>
    
    <button id="btnIniciar">🚀 INICIAR DESAFIO</button>
    <div id="statusConexao" class="text-center mt-2" style="font-size:12px;"></div>
</template>

<template id="telaJogoTemplate">
    <div style="display:flex; justify-content:space-between; background:#f8fafc; border-radius:30px; padding:12px 20px; margin-bottom:25px; gap:15px; flex-wrap:wrap;">
        <div style="background:white; border-radius:20px; padding:8px 16px; flex:1; text-align:center;">
            <span style="font-size:12px;">⭐ PONTOS</span>
            <div style="font-size:28px; font-weight:800;" id="pontos">0</div>
        </div>
        <div style="background:white; border-radius:20px; padding:8px 16px; flex:1; text-align:center;">
            <span style="font-size:12px;">✅ ACERTOS</span>
            <div style="font-size:28px; font-weight:800;" id="acertos">0</div>
        </div>
        <div style="background:white; border-radius:20px; padding:8px 16px; flex:1; text-align:center;">
            <span style="font-size:12px;">❌ ERROS</span>
            <div style="font-size:28px; font-weight:800;" id="erros">0</div>
        </div>
        <div style="background:white; border-radius:20px; padding:8px 16px; flex:1; text-align:center;">
            <span style="font-size:12px;">⏱️ TEMPO</span>
            <div style="font-size:28px; font-weight:800;" id="tempo">00:00</div>

    </div>

    <div style="display:flex; justify-content:space-between; background:#f8fafc; border-radius:30px; padding:8px 16px; margin-bottom:20px;">
        <div><strong>Nível:</strong> <span id="nivelAtual">1</span></div>
        <div><strong>Pergunta:</strong> <span id="perguntaAtual">1</span> / <span id="totalPerguntas">10</span></div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="numeros-container">
        <div class="numero-card" id="numeroEsquerda">0</div>
        <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
            <button class="operador-btn" id="opMaior">&gt;</button>
            <button class="operador-btn" id="opMenor">&lt;</button>
            <button class="operador-btn" id="opIgual">=</button>
        </div>
        <div class="numero-card" id="numeroDireita">0</div>
    </div>
    
    <button id="btnSair" style="background:#10b981;">🔒 SAIR</button>
    <button id="btnPular" style="background:#f59e0b;">⏭️ PULAR PERGUNTA</button>
</template>

<template id="telaFinalTemplate">
    <h1>🏆 Parabéns!</h1>
    <div style="background:#eef2ff; padding:20px; border-radius:30px; margin:20px 0;">
        <p><strong>Pontuação final:</strong> <span id="finalPontos">0</span></p>
        <p><strong>Acertos:</strong> <span id="finalAcertos">0</span> / <span id="totalPerguntasFinal">10</span></p>
        <p><strong>Erros:</strong> <span id="finalErros">0</span></p>
        <p><strong>Nível máximo:</strong> <span id="finalNivel">1</span></p>
        <p><strong>Tempo:</strong> <span id="finalTempo">00:00</span></p>
        <div class="estrelas" id="estrelasContainer">
            <span class="estrela" id="estrela1">★</span>
            <span class="estrela" id="estrela2">★</span>
            <span class="estrela" id="estrela3">★</span>
        </div>
        <div id="msgSalvo" class="text-sm mt-2"></div>
    </div>
    
    <div id="revisaoErrosContainer" class="hidden">
        <h3>📝 Revisão dos erros:</h3>
        <div id="listaErros" class="revisao-erros"></div>
    </div>
    
    <button id="btnNovamente">🔄 JOGAR NOVAMENTE</button>
    <button id="btnFecharAba" style="background:#10b981;">🚪 FECHAR ESTA ABA</button>
    <div id="mensagemAba" class="text-sm mt-2"></div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    class JogoComparacaoNumeros {
        constructor() {
            this.SUPABASE_URL = 'https://qmcqffnawtfaenyziwsn.supabase.co';
            this.SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtY3FmZm5hd3RmYWVueXppd3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNTM5NTMsImV4cCI6MjA4OTcyOTk1M30._CjaNoeJeQp-8s8Jt-dk3bJfktdEV97R5LhLnWgYrNc';
            
            this.urlParams = new URLSearchParams(window.location.search);
            this.alunoId = this.urlParams.get('aluno_id');
            this.jogoId = this.urlParams.get('jogo_id');
            this.turmaId = this.urlParams.get('turma_id');
            this.modoTeste = this.urlParams.get('modo_teste') === 'true';
            
            this.pontuacao = 0;
            this.acertos = 0;
            this.erros = 0;
            this.jogoAtivo = false;
            this.tempoInicio = null;
            this.tempoDecorrido = 0;
            this.intervalo = null;
            this.detalhesErros = [];
            this.numeroEsquerda = 0;
            this.numeroDireita = 0;
            this.operadorCorreto = '';
            this.nivel = 1;
            this.perguntasRespondidas = 0;
            this.nivelSelecionado = 'medio';
            this.TOTAL_PERGUNTAS = 10;
            this.botoesBloqueados = false;
            this.alunoNome = '';
            
            this.supabase = window.supabase.createClient(this.SUPABASE_URL, this.SUPABASE_KEY);
            
            this.niveisConfig = {
                facil: { nome: 'Fácil', maxInicial: 20, incremento: 10, maxAbsoluto: 100 },
                medio: { nome: 'Médio', maxInicial: 50, incremento: 25, maxAbsoluto: 200 },
                dificil: { nome: 'Difícil', maxInicial: 100, incremento: 50, maxAbsoluto: 500 }
            };
        }
        
        getMaxNumero() {
            const config = this.niveisConfig[this.nivelSelecionado];
            const incrementos = Math.floor((this.nivel - 1) / 2);
            let maxNumero = config.maxInicial + (incrementos * config.incremento);
            return Math.min(maxNumero, config.maxAbsoluto);
        }
        
        async verificarAcessoJogo() {
            if (this.modoTeste) {
                console.log('🔧 Modo teste - acesso liberado');
                return true;
            }
            
            if (!this.alunoId || !this.jogoId || !this.turmaId) {
                this.mostrarErroAcesso('❌ Link inválido. Contate seu professor.');
                return false;
            }
            
            try {
                this.mostrarLoading(true);
                
                const { data: aluno, error: alunoError } = await this.supabase
                    .from('alunos')
                    .select('id, nome_aluno, ativo, turma_id')
                    .eq('id', this.alunoId)
                    .eq('ativo', true)
                    .single();
                
                if (alunoError || !aluno) {
                    this.mostrarErroAcesso('❌ Aluno não encontrado ou inativo.');
                    return false;
                }
                
                if (aluno.turma_id !== this.turmaId) {
                    this.mostrarErroAcesso('❌ Turma não corresponde ao aluno.');
                    return false;
                }
                
                this.alunoNome = aluno.nome_aluno;
                this.mostrarLoading(false);
                return true;
                
            } catch (error) {
                console.error('Erro na verificação:', error);
                this.mostrarErroAcesso('Erro ao verificar acesso.');
                return false;
            }
        }
        
        mostrarLoading(mostrar) {
            const statusDiv = document.getElementById('statusConexao');
            if (statusDiv) {
                if (mostrar) {
                    statusDiv.innerHTML = '<div class="loading"></div> Verificando...';
                } else {
                    statusDiv.innerHTML = this.modoTeste ? '🔧 Modo teste' : '✅ Conectado';
                }
            }
        }
        
        mostrarErroAcesso(mensagem) {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="erro-acesso" style="background: white; border-radius: 40px; padding: 40px; max-width: 500px; margin: 20px auto;">
                    <h2>⛔ Acesso Negado</h2>
                    <p style="color: #e53e3e; margin: 20px 0;">${mensagem}</p>
                    <button onclick="window.history.back()">Voltar</button>
                </div>
            `;
        }
        
        calcularEstrelas() {
            if (this.erros === 0 && this.tempoDecorrido <= 30) return 3;
            if (this.erros <= 2 && this.tempoDecorrido <= 60) return 2;
            return 1;
        }
        
        exibirEstrelas(qtd) {
            for (let i = 1; i <= 3; i++) {
                const estrela = document.getElementById(`estrela${i}`);
                if (estrela) {
                    if (i <= qtd) estrela.classList.add('ativa');
                    else estrela.classList.remove('ativa');
                }
            }
        }
        
        animarNumero() {
            const esquerda = document.getElementById('numeroEsquerda');
            const direita = document.getElementById('numeroDireita');
            if (esquerda) esquerda.classList.add('animar');
            if (direita) direita.classList.add('animar');
            setTimeout(() => {
                if (esquerda) esquerda.classList.remove('animar');
                if (direita) direita.classList.remove('animar');
            }, 300);
        }
        
        gerarPergunta() {
            const maxNum = this.getMaxNumero();
            this.numeroEsquerda = Math.floor(Math.random() * (maxNum + 1));
            this.numeroDireita = Math.floor(Math.random() * (maxNum + 1));
            
            if (this.numeroEsquerda > this.numeroDireita) this.operadorCorreto = '>';
            else if (this.numeroEsquerda < this.numeroDireita) this.operadorCorreto = '<';
            else this.operadorCorreto = '=';
            
            const numEsqElement = document.getElementById('numeroEsquerda');
            const numDirElement = document.getElementById('numeroDireita');
            if (numEsqElement) numEsqElement.textContent = this.numeroEsquerda;
            if (numDirElement) numDirElement.textContent = this.numeroDireita;
            
            const nivelEl = document.getElementById('nivelAtual');
            const perguntaEl = document.getElementById('perguntaAtual');
            if (nivelEl) nivelEl.textContent = this.nivel;
            if (perguntaEl) perguntaEl.textContent = this.perguntasRespondidas + 1;
            
            this.animarNumero();
            this.atualizarProgresso();
        }
        
        atualizarUI() {
            const pontosEl = document.getElementById('pontos');
            const acertosEl = document.getElementById('acertos');
            const errosEl = document.getElementById('erros');
            if (pontosEl) pontosEl.textContent = Math.floor(this.pontuacao);
            if (acertosEl) acertosEl.textContent = this.acertos;
            if (errosEl) errosEl.textContent = this.erros;
        }
        
        atualizarProgresso() {
            const progressFill = document.getElementById('progressFill');
            if (progressFill) {
                const percent = (this.perguntasRespondidas / this.TOTAL_PERGUNTAS) * 100;
                progressFill.style.width = `${percent}%`;
            }
        }
        
        iniciarCronometro() {
            if (this.intervalo) clearInterval(this.intervalo);
            this.intervalo = setInterval(() => {
                if (!this.jogoAtivo) return;
                this.tempoDecorrido = Math.floor((Date.now() - this.tempoInicio) / 1000);
                const minutos = Math.floor(this.tempoDecorrido / 60);
                const segundos = this.tempoDecorrido % 60;
                const tempoFormatado = `${minutos.toString().padStart(2, '0')}:${segundos.toString().padStart(2, '0')}`;
                const tempoEl = document.getElementById('tempo');
                if (tempoEl) tempoEl.textContent = tempoFormatado;
            }, 1000);
        }
        
        pararCronometro() {
            if (this.intervalo) clearInterval(this.intervalo);
            this.intervalo = null;
            if (this.tempoInicio) {
                this.tempoDecorrido = Math.floor((Date.now() - this.tempoInicio) / 1000);
            }
        }
        
        async salvarResultado() {
            if (this.modoTeste || !this.alunoId || !this.jogoId || !this.turmaId) {
                const msgDiv = document.getElementById('msgSalvo');
                if (msgDiv) {
                    msgDiv.innerHTML = this.modoTeste ? '🔧 Modo teste - dados não salvos' : '⚠️ Parâmetros ausentes';
                }
                return;
            }
            
            // Dados compatíveis com a tabela 'resultados' (sem campo extra)
            const dados = {
                aluno_id: this.alunoId,
                jogo_id: this.jogoId,
                turma_id: this.turmaId,
                acertos: this.acertos,
                erros: this.erros,
                tempo_segundos: this.tempoDecorrido,
                total_questoes: this.TOTAL_PERGUNTAS,
                habilidade_bncc: 'EF1a5.MAT.1.03',
                detalhes_erros: this.detalhesErros.slice(0, 20)  // Correto: objeto com pergunta, resposta_aluno, resposta_correta
            };
            
            console.log('💾 Salvando resultado:', dados);
            
            try {
                const { data, error } = await this.supabase
                    .from('resultados')
                    .insert([dados])
                    .select();
                
                const msgDiv = document.getElementById('msgSalvo');
                if (error) {
                    console.error('❌ Erro:', error);
                    msgDiv.innerHTML = `❌ Erro: ${error.message}`;
                    msgDiv.style.color = '#991b1b';
                } else {
                    console.log('✅ Salvo com sucesso:', data);
                    msgDiv.innerHTML = '✅ Pontuação registrada com sucesso!';
                    msgDiv.style.color = '#065f46';
                    setTimeout(() => {
                        if (msgDiv.innerHTML === '✅ Pontuação registrada com sucesso!') {
                            msgDiv.innerHTML = '';
                        }
                    }, 3000);
                }
            } catch (error) {
                console.error('❌ Erro na requisição:', error);
                const msgDiv = document.getElementById('msgSalvo');
                if (msgDiv) {
                    msgDiv.innerHTML = '❌ Erro de conexão ao salvar';
                    msgDiv.style.color = '#991b1b';
                }
            }
        }
        
        async finalizarJogo() {
            if (!this.jogoAtivo) return;
            this.jogoAtivo = false;
            this.pararCronometro();
            
            const estrelas = this.calcularEstrelas();
            this.exibirEstrelas(estrelas);
            
            const finalPontos = document.getElementById('finalPontos');
            const finalAcertos = document.getElementById('finalAcertos');
            const finalErros = document.getElementById('finalErros');
            const finalNivel = document.getElementById('finalNivel');
            const finalTempo = document.getElementById('finalTempo');
            const totalPerguntasFinal = document.getElementById('totalPerguntasFinal');
            
            if (finalPontos) finalPontos.textContent = Math.floor(this.pontuacao);

            if (finalNivel) finalNivel.textContent = this.nivel;

        }
        
        mostrarRevisaoErros() {
            const container = document.getElementById('revisaoErrosContainer');
            const listaErros = document.getElementById('listaErros');
            
            if (!container || !listaErros) return;
            
            if (this.detalhesErros.length > 0) {
                container.classList.remove('hidden');
                listaErros.innerHTML = this.detalhesErros.map((erro, index) => `
                    <div class="erro-item">
                        <strong>❌ Erro ${index + 1}:</strong> ${erro.pergunta}<br>
                        <span style="color: #dc2626;">Sua resposta: ${erro.resposta_aluno}</span><br>
                        <span style="color: #059669;">Resposta correta: ${erro.resposta_correta}</span>
                    </div>
                `).join('');
            } else {
                container.classList.add('hidden');
            }
        }
        
        registrarAcerto() {
            if (!this.jogoAtivo) return;
            this.pontuacao += 10;
            this.acertos++;

                this.nivel++;
                const nivelEl = document.getElementById('nivelAtual');
                if (nivelEl) nivelEl.textContent = this.nivel;
            }
        }

            this.erros++;
