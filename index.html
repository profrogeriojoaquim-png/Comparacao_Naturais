<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Saci Sabido - Comparação de Números</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 40px;
            padding: 24px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #4f46e5;
            transform: scale(1.02);
        }

        .hidden {
            display: none;
        }

        .feedback {
            margin: 15px auto;
            padding: 10px;
            border-radius: 40px;
            font-weight: bold;
        }

        .feedback-sucesso {
            background: #bbf7d0;
            color: #166534;
        }

        .feedback-erro {
            background: #fee2e2;
            color: #991b1b;
        }

        .numero-card {
            background: #f1f5f9;
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            font-family: monospace;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-width: 120px;
        }

        .operador-btn {
            font-size: 32px;
            font-weight: bold;
            background: #f8fafc;
            color: #1e293b;
            border: 2px solid #e2e8f0;
            padding: 20px 25px;
            border-radius: 60px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .operador-btn:hover {
            background: #e0e7ff;
            border-color: #6366f1;
            transform: scale(1.05);
        }

        .numeros-container {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .text-center {
            text-align: center;
        }

        .mt-2 {
            margin-top: 8px;
        }

        .info-sesi {
            background: #fef9c3;
            border-radius: 20px;
            padding: 10px;
            margin-top: 10px;
            font-size: 12px;
            color: #854d0e;
        }

        .erro-acesso {
            text-align: center;
            padding: 50px;
            font-family: Arial, sans-serif;
        }
        .erro-acesso h2 {
            color: #e53e3e;
            margin-bottom: 20px;
        }
        .erro-acesso button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- O conteúdo será carregado dinamicamente -->
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ==================== CONFIGURAÇÕES DO SUPABASE ====================
    const SUPABASE_URL = 'https://qmcqffnawtfaenyziwsn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtY3FmZm5hd3RmYWVueXppd3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNTM5NTMsImV4cCI6MjA4OTcyOTk1M30._CjaNoeJeQp-8s8Jt-dk3bJfktdEV97R5LhLnWgYrNc';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ==================== PARÂMETROS DA URL ====================
    const urlParams = new URLSearchParams(window.location.search);
    const jogoSlug = urlParams.get('jogo_slug');
    const alunoId = urlParams.get('aluno_id');
    const turmaId = urlParams.get('turma_id');
    const escolaId = urlParams.get('escola_id');
    const modoTeste = urlParams.get('modo_teste') === 'true';

    // ==================== VARIÁVEIS DO JOGO ====================
    let pontuacao = 0;
    let acertos = 0;
    let erros = 0;
    let jogoAtivo = false;
    let tempoInicio = null;
    let tempoDecorrido = 0;
    let intervalo = null;
    let detalhesErros = [];
    let numeroEsquerda = 0;
    let numeroDireita = 0;
    let operadorCorreto = '';
    let nivel = 1;
    let perguntasRespondidas = 0;
    let jogoId = null;
    const TOTAL_PERGUNTAS = 10;

    // ==================== FUNÇÃO DE VERIFICAÇÃO DE ACESSO ====================
    async function verificarAcessoJogo() {
        if (modoTeste) {
            console.log('🔧 Modo teste - acesso liberado sem verificação');
            return true;
        }
        
        if (!jogoSlug || !turmaId || !escolaId) {
            mostrarErroAcesso('❌ Link inválido. Faltam parâmetros necessários. Contate seu professor.');
            return false;
        }
        
        try {
            // Buscar informações do jogo
            const { data: jogo, error: jogoError } = await supabaseClient
                .from('jogos')
                .select('id, nome, segmento')
                .eq('slug', jogoSlug)
                .single();
            
            if (jogoError || !jogo) {
                mostrarErroAcesso('❌ Jogo não encontrado.');
                return false;
            }
            
            jogoId = jogo.id;
            
            // Verificar se o jogo está ativo para a turma
            const { data: jogoTurma, error: turmaError } = await supabaseClient
                .from('jogos_turma')
                .select('status, data_inicio, data_fim')
                .eq('turma_id', turmaId)
                .eq('jogo_id', jogoId)
                .single();
            
            if (turmaError || !jogoTurma) {
                mostrarErroAcesso('❌ Este jogo não foi atribuído à sua turma pelo professor.');
                return false;
            }
            
            // Verificar status
            const hoje = new Date().toISOString().split('T')[0];
            
            if (jogoTurma.status === 'inativo') {
                mostrarErroAcesso('❌ Este jogo está bloqueado pelo professor.');
                return false;
            }
            
            if (jogoTurma.status === 'agendado') {
                if (jogoTurma.data_inicio && hoje < jogoTurma.data_inicio) {
                    const dataFormatada = formatarData(jogoTurma.data_inicio);
                    mostrarErroAcesso(`📅 Este jogo estará disponível a partir de ${dataFormatada}`);
                    return false;
                }
                if (jogoTurma.data_fim && hoje > jogoTurma.data_fim) {
                    const dataFormatada = formatarData(jogoTurma.data_fim);
                    mostrarErroAcesso(`⏰ O prazo para este jogo encerrou em ${dataFormatada}`);
                    return false;
                }
            }
            
            // Registrar acesso permitido
            registrarAcessoPermitido();
            return true;
            
        } catch (error) {
            console.error('Erro na verificação:', error);
            mostrarErroAcesso('Erro ao verificar acesso. Tente novamente mais tarde.');
            return false;
        }
    }
    
    function mostrarErroAcesso(mensagem) {
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="erro-acesso" style="background: white; border-radius: 40px; padding: 40px; max-width: 500px; margin: 20px auto;">
                <h2>⛔ Acesso Negado</h2>
                <p style="color: #e53e3e; margin: 20px 0;">${mensagem}</p>
                <button onclick="window.history.back()">Voltar</button>
            </div>
        `;
    }
    
    function formatarData(dataISO) {
        const partes = dataISO.split('-');
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }
    
    async function registrarAcessoPermitido() {
        try {
            await supabaseClient.from('logs_acesso_jogos').insert([{
                aluno_id: alunoId || null,
                jogo_id: jogoId,
                turma_id: turmaId,
                acesso_liberado: true,
                ip: null,
                timestamp: new Date()
            }]);
        } catch(e) {
            console.log('Erro ao registrar log:', e);
        }
    }

    // ==================== FUNÇÕES DO JOGO ====================
    function getMaxNumero(nivel) {
        if (nivel <= 2) return 20;
        if (nivel <= 4) return 50;
        if (nivel <= 6) return 100;
        if (nivel <= 8) return 500;
        return 1000;
    }

    function gerarPergunta() {
        const maxNum = getMaxNumero(nivel);
        numeroEsquerda = Math.floor(Math.random() * (maxNum + 1));
        numeroDireita = Math.floor(Math.random() * (maxNum + 1));

        if (numeroEsquerda > numeroDireita) operadorCorreto = '>';
        else if (numeroEsquerda < numeroDireita) operadorCorreto = '<';
        else operadorCorreto = '=';

        document.getElementById('numeroEsquerda').textContent = numeroEsquerda;
        document.getElementById('numeroDireita').textContent = numeroDireita;
        document.getElementById('nivelAtual').textContent = nivel;
        document.getElementById('perguntaAtual').textContent = perguntasRespondidas + 1;
    }

    function atualizarUI() {
        document.getElementById('pontos').textContent = Math.floor(pontuacao);
    }

    function mostrarFeedback(mensagem, tipo) {
        const feedbackDiv = document.getElementById('feedbackJogo');
        feedbackDiv.textContent = mensagem;
        feedbackDiv.className = 'feedback';
        if (tipo === 'sucesso') feedbackDiv.classList.add('feedback-sucesso');
        else if (tipo === 'erro') feedbackDiv.classList.add('feedback-erro');
        setTimeout(() => {
            if (feedbackDiv.textContent === mensagem) {
                feedbackDiv.textContent = '';
                feedbackDiv.className = 'feedback';
            }
        }, 2000);
    }

    function iniciarCronometro() {
        if (intervalo) clearInterval(intervalo);
        intervalo = setInterval(() => {
            if (!jogoAtivo) return;
            tempoDecorrido = Math.floor((Date.now() - tempoInicio) / 1000);
        }, 1000);
    }

    function pararCronometro() {
        if (intervalo) clearInterval(intervalo);
        intervalo = null;
        if (tempoInicio) {
            tempoDecorrido = Math.floor((Date.now() - tempoInicio) / 1000);
        }
    }

    async function salvarResultado() {
        if (modoTeste || !alunoId) return;
        
        const dados = {
            aluno_id: alunoId,
            jogo_id: jogoId,
            turma_id: turmaId,
            acertos: acertos,
            erros: erros,
            tempo_segundos: tempoDecorrido,
            total_questoes: TOTAL_PERGUNTAS,
            habilidade_bncc: 'EF1a5.MAT.1.03',
            detalhes_erros: detalhesErros.slice(0, 20)
        };
        
        const { error } = await supabaseClient.from('resultados').insert([dados]);
        if (error) console.error("Erro ao salvar:", error);
    }

    async function finalizarJogo() {
        if (!jogoAtivo) return;
        jogoAtivo = false;
        pararCronometro();
        document.getElementById('finalPontos').textContent = Math.floor(pontuacao);
        document.getElementById('finalAcertos').textContent = acertos;
        document.getElementById('finalErros').textContent = erros;
        document.getElementById('finalNivel').textContent = nivel;
        await salvarResultado();
        document.getElementById('telaJogo').classList.add('hidden');
        document.getElementById('telaFinal').classList.remove('hidden');
    }

    function registrarAcerto(pontosGanhos = 10) {
        if (!jogoAtivo) return;
        pontuacao += pontosGanhos;
        acertos++;
        atualizarUI();
        mostrarFeedback(`✅ Correto! +${pontosGanhos} pontos`, 'sucesso');
        
        if (acertos % 3 === 0 && nivel < 20) {
            nivel++;
            mostrarFeedback(`📈 Você subiu para o nível ${nivel}!`, 'sucesso');
        }
    }

    function registrarErro(erroDetalhe = null) {
        if (!jogoAtivo) return;
        erros++;
        pontuacao = Math.max(0, pontuacao - 5);
        atualizarUI();
        if (erroDetalhe) detalhesErros.push(erroDetalhe);
        mostrarFeedback(`❌ Errado! -5 pontos. O correto era ${operadorCorreto}.`, 'erro');
    }

    function responderOperador(operadorEscolhido) {
        if (!jogoAtivo) return;
        const acertou = (operadorEscolhido === operadorCorreto);
        
        if (acertou) {
            registrarAcerto(10);
        } else {
            const detalhe = {
                num1: numeroEsquerda,
                num2: numeroDireita,
                respostaEscolhida: operadorEscolhido,
                respostaCorreta: operadorCorreto,
                nivel: nivel
            };
            registrarErro(detalhe);
        }

        perguntasRespondidas++;
        document.getElementById('perguntaAtual').textContent = perguntasRespondidas + 1;

        if (perguntasRespondidas >= TOTAL_PERGUNTAS) {
            finalizarJogo();
        } else {
            gerarPergunta();
        }
    }

    function iniciarJogo() {
        pontuacao = 0;
        acertos = 0;
        erros = 0;
        nivel = 1;
        perguntasRespondidas = 0;
        detalhesErros = [];
        jogoAtivo = true;
        tempoInicio = Date.now();
        tempoDecorrido = 0;
        atualizarUI();
        gerarPergunta();
        iniciarCronometro();
        
        document.getElementById('telaInicial').classList.add('hidden');
        document.getElementById('telaJogo').classList.remove('hidden');
        document.getElementById('telaFinal').classList.add('hidden');
        document.getElementById('feedbackJogo').textContent = '';
    }

    // ==================== RENDERIZAR TELA INICIAL ====================
    async function carregarJogo() {
        const acessoLiberado = await verificarAcessoJogo();
        
        if (!acessoLiberado && !modoTeste) {
            return;
        }
        
        // Renderizar o HTML do jogo
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="container">
                <div id="telaInicial">
                    <h1>🧮 Comparação de Números Naturais</h1>
                    <p>Escolha o símbolo correto: maior, menor ou igual.</p>
                    
                    <div class="info-sesi">
                        📚 Currículo SESI-SP | Habilidade: <strong>EF1a5.MAT.1.03</strong><br>
                        🎯 Comparar e ordenar números naturais em diferentes contextos
                    </div>

                    <div style="background:#f1f5f9; border-radius:20px; padding:12px; margin:20px 0; font-size:14px; text-align:left;">
                        <strong>📋 Como jogar:</strong><br>
                        • Você verá dois números.<br>
                        • Escolha o operador correto: <strong>></strong> (maior), <strong>&lt;</strong> (menor) ou <strong>=</strong> (igual).<br>
                        • A cada acerto, você avança de nível!<br>
                        • Cada acerto vale 10 pontos; cada erro desconta 5 pontos.<br>
                        • Complete 10 perguntas para finalizar.
                    </div>
                    
                    <button id="btnIniciar">🚀 INICIAR JOGO</button>
                    <div id="statusConexao" class="text-center mt-2" style="font-size:12px;">
                        ${modoTeste ? '🔧 Modo teste' : '✅ Conectado'}
                    </div>
                </div>

                <div id="telaJogo" class="hidden">
                    <div style="display:flex; justify-content:space-between; background:#f8fafc; border-radius:30px; padding:12px 20px; margin-bottom:25px; gap:15px; flex-wrap:wrap;">
                        <div style="background:white; border-radius:20px; padding:8px 16px; flex:1; text-align:center;">
                            <span style="font-size:12px;">PONTOS</span>
                            <div style="font-size:28px; font-weight:800;" id="pontos">0</div>
                        </div>
                        <div style="background:white; border-radius:20px; padding:8px 16px; flex:1; text-align:center;">
                            <span style="font-size:12px;">PERGUNTA</span>
                            <div style="font-size:28px; font-weight:800;" id="perguntaAtual">1</div>
                        </div>
                        <div style="background:white; border-radius:20px; padding:8px 16px; flex:1; text-align:center;">
                            <span style="font-size:12px;">NÍVEL</span>
                            <div style="font-size:28px; font-weight:800;" id="nivelAtual">1</div>
                        </div>
                    </div>

                    <div class="numeros-container">
                        <div class="numero-card" id="numeroEsquerda">0</div>
                        <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                            <button class="operador-btn" id="opMaior">&gt;</button>
                            <button class="operador-btn" id="opMenor">&lt;</button>
                            <button class="operador-btn" id="opIgual">=</button>
                        </div>
                        <div class="numero-card" id="numeroDireita">0</div>
                    </div>
                    
                    <div id="feedbackJogo" class="feedback"></div>
                    <button id="btnSair">🚪 SAIR</button>
                </div>

                <div id="telaFinal" class="hidden">
                    <h1>🏆 Fim de jogo!</h1>
                    <div style="background:#eef2ff; padding:20px; border-radius:30px; margin:20px 0;">
                        <p><strong>Pontuação final:</strong> <span id="finalPontos">0</span></p>
                        <p><strong>Acertos:</strong> <span id="finalAcertos">0</span></p>
                        <p><strong>Erros:</strong> <span id="finalErros">0</span></p>
                        <p><strong>Nível máximo:</strong> <span id="finalNivel">1</span></p>
                        <div id="msgSalvo" class="text-sm mt-2"></div>
                    </div>
                    <button id="btnNovamente">🔄 JOGAR NOVAMENTE</button>
                </div>
            </div>
        `;
        
        // Conectar eventos
        document.getElementById('btnIniciar').onclick = iniciarJogo;
        document.getElementById('btnSair').onclick = () => {
            if (jogoAtivo && confirm("Deseja sair? O progresso será perdido.")) {
                finalizarJogo();
            } else if (!jogoAtivo) {
                document.getElementById('telaJogo').classList.add('hidden');
                document.getElementById('telaInicial').classList.remove('hidden');
            }
        };
        document.getElementById('btnNovamente').onclick = () => {
            document.getElementById('telaFinal').classList.add('hidden');
            document.getElementById('telaInicial').classList.remove('hidden');
        };
        document.getElementById('opMaior').onclick = () => responderOperador('>');
        document.getElementById('opMenor').onclick = () => responderOperador('<');
        document.getElementById('opIgual').onclick = () => responderOperador('=');
    }
    
    // Iniciar
    carregarJogo();
</script>
</body>
</html>
