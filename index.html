<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Saci Sabido - Comparação de Números</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 40px;
            padding: 24px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #4f46e5;
            transform: scale(1.02);
        }

        .hidden {
            display: none;
        }

        .feedback {
            margin: 15px auto;
            padding: 10px;
            border-radius: 40px;
            font-weight: bold;
        }

        .feedback-erro {
            background: #fee2e2;
            color: #991b1b;
        }

        .numero-card {
            background: #f1f5f9;
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            font-family: monospace;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-width: 120px;
        }

        .operador-btn {
            font-size: 32px;
            font-weight: bold;
            background: #f8fafc;
            color: #1e293b;
            border: 2px solid #e2e8f0;
            padding: 20px 25px;
            border-radius: 60px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .operador-btn:hover {
            background: #e0e7ff;
            border-color: #6366f1;
            transform: scale(1.05);
        }

        .numeros-container {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .text-center {
            text-align: center;
        }

        .mt-2 {
            margin-top: 8px;
        }

        .info-sesi {
            background: #fef9c3;
            border-radius: 20px;
            padding: 10px;
            margin-top: 10px;
            font-size: 12px;
            color: #854d0e;
        }

        .erro-acesso {
            text-align: center;
            padding: 50px;
            font-family: Arial, sans-serif;
        }
        .erro-acesso h2 {
            color: #e53e3e;
            margin-bottom: 20px;
        }
        .erro-acesso button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        .estrelas {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 10px 0;
        }
        .estrela {
            font-size: 28px;
            color: #cbd5e1;
        }
        .estrela.ativa {
            color: #fbbf24;
            text-shadow: 0 0 2px goldenrod;
        }

        .personagem-convite {
            display: flex;
            align-items: center;
            gap: 20px;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }
        .personagem-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #d97706;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }
        .personagem-fala {
            flex: 1;
        }
        .personagem-fala p {
            font-size: 16px;
            font-weight: bold;
            color: #92400e;
            margin-bottom: 8px;
        }
        .personagem-fala small {
            color: #b45309;
        }
        .niveis-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }
        .btn-nivel {
            background: #e2e8f0;
            color: #1e293b;
            padding: 12px 24px;
            font-size: 14px;
        }
        .btn-nivel.ativo {
            background: #6366f1;
            color: white;
        }
    </style>
</head>
<body>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ==================== CONFIGURAÇÕES DO SUPABASE ====================
    const SUPABASE_URL = 'https://qmcqffnawtfaenyziwsn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtY3FmZm5hd3RmYWVueXppd3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNTM5NTMsImV4cCI6MjA4OTcyOTk1M30._CjaNoeJeQp-8s8Jt-dk3bJfktdEV97R5LhLnWgYrNc';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ==================== PARÂMETROS DA URL ====================
    const urlParams = new URLSearchParams(window.location.search);
    const alunoId = urlParams.get('aluno_id');
    const jogoId = urlParams.get('jogo_id');
    const turmaId = urlParams.get('turma_id');
    const accessToken = urlParams.get('token');
    const modoTeste = urlParams.get('modo_teste') === 'true';

    // ==================== VARIÁVEIS DA ATIVIDADE ====================
    let pontuacao = 0;
    let acertos = 0;
    let erros = 0;
    let jogoAtivo = false;
    let tempoInicio = null;
    let tempoDecorrido = 0;
    let intervalo = null;
    let detalhesErros = [];
    let numeroEsquerda = 0;
    let numeroDireita = 0;
    let operadorCorreto = '';
    let nivel = 1;
    let perguntasRespondidas = 0;
    let jogoIdAtual = jogoId;
    let jogoNome = '';
    let nivelSelecionado = 'medio';
    const TOTAL_PERGUNTAS = 10;

    // ==================== NÍVEIS ====================
    const niveisConfig = {
        facil: { nome: 'Fácil', maxInicial: 20, incremento: 10 },
        medio: { nome: 'Médio', maxInicial: 50, incremento: 25 },
        dificil: { nome: 'Difícil', maxInicial: 100, incremento: 50 }
    };

    function getMaxNumero(nivel) {
        const config = niveisConfig[nivelSelecionado];
        const maxInicial = config.maxInicial;
        const incremento = config.incremento;
        let incrementos = Math.floor((nivel - 1) / 2);
        return maxInicial + (incrementos * incremento);
    }

    // ==================== FUNÇÃO DE VERIFICAÇÃO DE ACESSO ====================
    async function verificarAcessoJogo() {
        if (modoTeste) {
            console.log('🔧 Modo teste - acesso liberado sem verificação');
            return true;
        }
        
        if (!alunoId || !jogoId || !turmaId) {
            mostrarErroAcesso('❌ Link inválido. Faltam parâmetros necessários. Contate seu professor.');
            return false;
        }
        
        try {
            const { data: jogo, error: jogoError } = await supabaseClient
                .from('jogos')
                .select('id, nome')
                .eq('id', jogoId)
                .single();
            
            if (jogoError || !jogo) {
                mostrarErroAcesso('❌ Atividade não encontrada.');
                return false;
            }
            
            jogoNome = jogo.nome;
            jogoIdAtual = jogo.id;
            
            const { data: aluno, error: alunoError } = await supabaseClient
                .from('alunos')
                .select('id, nome_aluno, ativo, turma_id')
                .eq('id', alunoId)
                .eq('ativo', true)
                .single();
            
            if (alunoError || !aluno) {
                mostrarErroAcesso('❌ Aluno não encontrado ou inativo. Contate seu professor.');
                return false;
            }
            
            if (aluno.turma_id !== turmaId) {
                mostrarErroAcesso('❌ Turma não corresponde ao aluno. Contate seu professor.');
                return false;
            }
            
            return true;
            
        } catch (error) {
            console.error('Erro na verificação:', error);
            mostrarErroAcesso('Erro ao verificar acesso. Tente novamente mais tarde.');
            return false;
        }
    }
    
    function mostrarErroAcesso(mensagem) {
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="erro-acesso" style="background: white; border-radius: 40px; padding: 40px; max-width: 500px; margin: 20px auto;">
                <h2>⛔ Acesso Negado</h2>
                <p style="color: #e53e3e; margin: 20px 0;">${mensagem}</p>
                <button onclick="window.history.back()">Voltar</button>
            </div>
        `;
    }

    // ==================== FUNÇÕES DA ATIVIDADE ====================
    function calcularEstrelas() {
        if (erros === 0 && tempoDecorrido <= 30) return 3;
        if (erros <= 2 && tempoDecorrido <= 60) return 2;
        return 1;
    }

    function exibirEstrelas(qtd) {
        for (let i = 1; i <= 3; i++) {
            const estrela = document.getElementById(`estrela${i}`);
            if (estrela) {
                if (i <= qtd) estrela.classList.add('ativa');
                else estrela.classList.remove('ativa');
            }
        }
    }

    function gerarPergunta() {
        const maxNum = getMaxNumero(nivel);
        numeroEsquerda = Math.floor(Math.random() * (maxNum + 1));
        numeroDireita = Math.floor(Math.random() * (maxNum + 1));

        if (numeroEsquerda > numeroDireita) operadorCorreto = '>';
        else if (numeroEsquerda < numeroDireita) operadorCorreto = '<';
        else operadorCorreto = '=';

        document.getElementById('numeroEsquerda').textContent = numeroEsquerda;
        document.getElementById('numeroDireita').textContent = numeroDireita;
        document.getElementById('nivelAtual').textContent = nivel;
        document.getElementById('perguntaAtual').textContent = perguntasRespondidas + 1;
    }

    function atualizarUI() {
        document.getElementById('pontos').textContent = Math.floor(pontuacao);
        document.getElementById('acertos').textContent = acertos;
        document.getElementById('erros').textContent = erros;
    }

    function mostrarFeedback(mensagem, tipo) {
        const feedbackDiv = document.getElementById('feedbackJogo');
        feedbackDiv.textContent = mensagem;
        feedbackDiv.className = 'feedback';
        if (tipo === 'erro') feedbackDiv.classList.add('feedback-erro');
        setTimeout(() => {
            if (feedbackDiv.textContent === mensagem) {
                feedbackDiv.textContent = '';
                feedbackDiv.className = 'feedback';
            }
        }, 500);
    }

    function iniciarCronometro() {
        if (intervalo) clearInterval(intervalo);
        intervalo = setInterval(() => {
            if (!jogoAtivo) return;
            tempoDecorrido = Math.floor((Date.now() - tempoInicio) / 1000);
            const minutos = Math.floor(tempoDecorrido / 60);
            const segundos = tempoDecorrido % 60;
            const tempoFormatado = `${minutos.toString().padStart(2, '0')}:${segundos.toString().padStart(2, '0')}`;
            const tempoEl = document.getElementById('tempo');
            if (tempoEl) tempoEl.textContent = tempoFormatado;
        }, 1000);
    }

    function pararCronometro() {
        if (intervalo) clearInterval(intervalo);
        intervalo = null;
        if (tempoInicio) {
            tempoDecorrido = Math.floor((Date.now() - tempoInicio) / 1000);
        }
    }

    async function salvarResultado() {
        if (modoTeste || !alunoId || !jogoIdAtual || !turmaId) {
            const msgDiv = document.getElementById('msgSalvo');
            if (msgDiv) msgDiv.innerHTML = modoTeste ? '🔧 Modo teste - dados não salvos' : '⚠️ Parâmetros ausentes - não salvo';
            return;
        }
        
        const dados = {
            aluno_id: alunoId,
            jogo_id: jogoIdAtual,
            turma_id: turmaId,
            acertos: acertos,
            erros: erros,
            tempo_segundos: tempoDecorrido,
            total_questoes: TOTAL_PERGUNTAS,
            habilidade_bncc: 'EF1a5.MAT.1.03',
            detalhes_erros: detalhesErros.slice(0, 20)
        };
        
        console.log('Salvando resultado:', dados);
        
        const { data, error } = await supabaseClient.from('resultados').insert([dados]).select();
        const msgDiv = document.getElementById('msgSalvo');
        if (error) {
            console.error('Erro ao salvar:', error);
            msgDiv.innerHTML = `❌ Erro ao salvar: ${error.message}`;
        } else {
            console.log('Salvo com sucesso:', data);
            msgDiv.innerHTML = '✅ Pontuação registrada!';
        }
    }

    async function finalizarJogo() {
        if (!jogoAtivo) return;
        jogoAtivo = false;
        pararCronometro();
        
        const estrelas = calcularEstrelas();
        exibirEstrelas(estrelas);
        
        document.getElementById('finalPontos').textContent = Math.floor(pontuacao);
        document.getElementById('finalAcertos').textContent = acertos;
        document.getElementById('finalErros').textContent = erros;
        document.getElementById('finalNivel').textContent = nivel;
        document.getElementById('finalTempo').textContent = `${Math.floor(tempoDecorrido / 60)}:${(tempoDecorrido % 60).toString().padStart(2, '0')}`;
        
        await salvarResultado();
        
        document.getElementById('telaJogo').classList.add('hidden');
        document.getElementById('telaFinal').classList.remove('hidden');
    }

    function registrarAcerto(pontosGanhos = 10) {
        if (!jogoAtivo) return;
        pontuacao += pontosGanhos;
        acertos++;
        atualizarUI();
        // SEM FEEDBACK DE ACERTO - apenas atualiza pontuação
        
        if (acertos % 3 === 0 && nivel < 20) {
            nivel++;
        }
    }

    function registrarErro(erroDetalhe = null) {
        if (!jogoAtivo) return;
        erros++;
        pontuacao = Math.max(0, pontuacao - 5);
        atualizarUI();
        if (erroDetalhe) detalhesErros.push(erroDetalhe);
        mostrarFeedback(`❌ O correto era ${operadorCorreto}.`, 'erro');
    }

    function responderOperador(operadorEscolhido) {
        if (!jogoAtivo) return;
        const acertou = (operadorEscolhido === operadorCorreto);
        
        if (acertou) {
            registrarAcerto(10);
        } else {
            const detalhe = {
                pergunta: `${numeroEsquerda} ? ${numeroDireita}`,
                resposta_aluno: operadorEscolhido,
                resposta_correta: operadorCorreto,
                detrator: `Aluno escolheu ${operadorEscolhido} quando o correto era ${operadorCorreto}`
            };
            registrarErro(detalhe);
        }

        perguntasRespondidas++;
        document.getElementById('perguntaAtual').textContent = perguntasRespondidas + 1;

        if (perguntasRespondidas >= TOTAL_PERGUNTAS) {
            finalizarJogo();
        } else {
            gerarPergunta();
        }
    }

    function iniciarJogo() {
        pontuacao = 0;
        acertos = 0;
        erros = 0;
        nivel = 1;
        perguntasRespondidas = 0;
        detalhesErros = [];
        jogoAtivo = true;
        tempoInicio = Date.now();
        tempoDecorrido = 0;
        atualizarUI();
        gerarPergunta();
        iniciarCronometro();
        
        document.getElementById('telaInicial').classList.add('hidden');
        document.getElementById('telaJogo').classList.remove('hidden');
        document.getElementById('telaFinal').classList.add('hidden');
        document.getElementById('feedbackJogo').textContent = '';
    }

    function fecharAba() {
        window.close();
        setTimeout(() => {
            const msgDiv = document.getElementById('mensagemAba');
            if (msgDiv) {
                msgDiv.innerHTML = "⚠️ Seu navegador não permitiu fechar esta aba. Feche manualmente.";
            }
        }, 200);
    }

    function selecionarNivel(nivel) {
        nivelSelecionado = nivel;
        document.querySelectorAll('.btn-nivel').forEach(btn => {
            btn.classList.remove('ativo');
        });
        document.querySelector(`.btn-nivel[data-nivel="${nivel}"]`).classList.add('ativo');
    }

    // ==================== RENDERIZAR TELA INICIAL ====================
    async function carregarJogo() {
        const acessoLiberado = await verificarAcessoJogo();
        
        if (!acessoLiberado && !modoTeste) {
            return;
        }
        
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="container">
                <div id="telaInicial">
                    <!-- Personagem Saci convidando -->
                    <div class="personagem-convite">
                        <div class="personagem-img">🎭</div>
                        <div class="personagem-fala">
                            <p>"E aí, corajoso! Vamos testar seus conhecimentos?"</p>
                            <small>⚡ Escolha um nível e comece o desafio!</small>
                        </div>
                    </div>
                    
                    <h1>🧮 Comparação de Números Naturais</h1>
                    
                    <div class="niveis-container">
                        <button class="btn-nivel ${nivelSelecionado === 'facil' ? 'ativo' : ''}" data-nivel="facil" onclick="selecionarNivel('facil')">🍃 Fácil</button>
                        <button class="btn-nivel ${nivelSelecionado === 'medio' ? 'ativo' : ''}" data-nivel="medio" onclick="selecionarNivel('medio')">⚡ Médio</button>
                        <button class="btn-nivel ${nivelSelecionado === 'dificil' ? 'ativo' : ''}" data-nivel="dificil" onclick="selecionarNivel('dificil')">🔥 Difícil</button>
                    </div>
                    
                    <div class="info-sesi">
                        📚 Habilidade: <strong>EF1a5.MAT.1.03</strong><br>
                        🎯 Comparar e ordenar números naturais em diferentes contextos
                    </div>

                    <div style="background:#f1f5f9; border-radius:20px; padding:12px; margin:20px 0; font-size:14px; text-align:left;">
                        <strong>📋 Como jogar:</strong><br>
                        • Você verá dois números.<br>
                        • Escolha o operador correto: <strong>></strong> (maior), <strong>&lt;</strong> (menor) ou <strong>=</strong> (igual).<br>
                        • A cada acerto, você avança de nível!<br>
                        • Complete 10 perguntas para finalizar.
                    </div>
                    
                    <button id="btnIniciar">🚀 INICIAR DESAFIO</button>
                    <div id="statusConexao" class="text-center mt-2" style="font-size:12px;">
                        ${modoTeste ? '🔧 Modo teste' : (alunoId && jogoId ? '✅ Conectado' : '⚠️ Sem parâmetros')}
                    </div>
                </div>

                <div id="telaJogo" class="hidden">
                    <div style="display:flex; justify-content:space-between; background:#f8fafc; border-radius:30px; padding:12px 20px; margin-bottom:25px; gap:15px; flex-wrap:wrap;">
                        <div style="background:white; border-radius:20px; padding:8px 16px; flex:1; text-align:center;">
                            <span style="font-size:12px;">⭐ PONTOS</span>
                            <div style="font-size:28px; font-weight:800;" id="pontos">0</div>
                        </div>
                        <div style="background:white; border-radius:20px; padding:8px 16px; flex:1; text-align:center;">
                            <span style="font-size:12px;">✅ ACERTOS</span>
                            <div style="font-size:28px; font-weight:800;" id="acertos">0</div>
                        </div>
                        <div style="background:white; border-radius:20px; padding:8px 16px; flex:1; text-align:center;">
                            <span style="font-size:12px;">❌ ERROS</span>
                            <div style="font-size:28px; font-weight:800;" id="erros">0</div>
                        </div>
                        <div style="background:white; border-radius:20px; padding:8px 16px; flex:1; text-align:center;">
                            <span style="font-size:12px;">⏱️ TEMPO</span>
                            <div style="font-size:28px; font-weight:800;" id="tempo">00:00</div>
                        </div>
                    </div>

                    <div style="display:flex; justify-content:space-between; background:#f8fafc; border-radius:30px; padding:8px 16px; margin-bottom:20px;">
                        <div><strong>Nível:</strong> <span id="nivelAtual">1</span></div>
                        <div><strong>Pergunta:</strong> <span id="perguntaAtual">1</span> / ${TOTAL_PERGUNTAS}</div>
                    </div>

                    <div class="numeros-container">
                        <div class="numero-card" id="numeroEsquerda">0</div>
                        <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                            <button class="operador-btn" id="opMaior">&gt;</button>
                            <button class="operador-btn" id="opMenor">&lt;</button>
                            <button class="operador-btn" id="opIgual">=</button>
                        </div>
                        <div class="numero-card" id="numeroDireita">0</div>
                    </div>
                    
                    <div id="feedbackJogo" class="feedback"></div>
                    <button id="btnSair" class="btn-fechar" style="background:#10b981;">🔒 SAIR</button>
                </div>

                <div id="telaFinal" class="hidden">
                    <h1>🏆 Parabéns!</h1>
                    <div style="background:#eef2ff; padding:20px; border-radius:30px; margin:20px 0;">
                        <p><strong>Pontuação final:</strong> <span id="finalPontos">0</span></p>
                        <p><strong>Acertos:</strong> <span id="finalAcertos">0</span> / ${TOTAL_PERGUNTAS}</p>
                        <p><strong>Erros:</strong> <span id="finalErros">0</span></p>
                        <p><strong>Nível máximo:</strong> <span id="finalNivel">1</span></p>
                        <p><strong>Tempo:</strong> <span id="finalTempo">00:00</span></p>
                        <div class="estrelas" id="estrelasContainer">
                            <span class="estrela" id="estrela1">★</span>
                            <span class="estrela" id="estrela2">★</span>
                            <span class="estrela" id="estrela3">★</span>
                        </div>
                        <div id="msgSalvo" class="text-sm mt-2"></div>
                    </div>
                    <button id="btnNovamente">🔄 JOGAR NOVAMENTE</button>
                    <button id="btnFecharAba" class="btn-fechar" style="background:#10b981;">🚪 FECHAR ESTA ABA</button>
                    <div id="mensagemAba" class="text-sm mt-2"></div>
                </div>
            </div>
        `;
        
        // Conectar eventos
        document.getElementById('btnIniciar').onclick = iniciarJogo;
        document.getElementById('btnSair').onclick = () => {
            if (jogoAtivo && confirm("Deseja sair? O progresso será perdido.")) {
                finalizarJogo();
            } else if (!jogoAtivo) {
                document.getElementById('telaJogo').classList.add('hidden');
                document.getElementById('telaInicial').classList.remove('hidden');
            }
        };
        document.getElementById('btnNovamente').onclick = () => {
            document.getElementById('telaFinal').classList.add('hidden');
            document.getElementById('telaInicial').classList.remove('hidden');
        };
        document.getElementById('btnFecharAba').onclick = fecharAba;
        document.getElementById('opMaior').onclick = () => responderOperador('>');
        document.getElementById('opMenor').onclick = () => responderOperador('<');
        document.getElementById('opIgual').onclick = () => responderOperador('=');
        
        // Expor funções para o escopo global
        window.selecionarNivel = selecionarNivel;
    }
    
    // Iniciar
    carregarJogo();
</script>
</body>
